<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | Avatar Video Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e2e8f0;
  }
  .card {
    background: #1e1e2e;
    border: 1px solid #3f3f5a;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo h1 { font-size: 22px; font-weight: 700; color: #fff; }
  .logo p { font-size: 13px; color: #94a3b8; margin-top: 6px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #94a3b8; font-weight: 600; margin-bottom: 6px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    background: #252538;
    border: 1px solid #3f3f5a;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #6366f1; }
  .btn {
    width: 100%;
    padding: 14px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .btn:hover { background: #4f46e5; }
  .error {
    background: rgba(248,113,113,0.1);
    border: 1px solid #f87171;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    color: #f87171;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🎬 Avatar Video Generator</h1>
    <p>Powered by HeyGen + ElevenLabs</p>
  </div>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="error">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}
  <form method="post">
    <div class="form-group">
      <label>ユーザー名</label>
      <input type="text" name="username" autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" name="password" autocomplete="current-password">
    </div>
    <button type="submit" class="btn">ログイン</button>
  </form>
</div>
</body>
</html>
